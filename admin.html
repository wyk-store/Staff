<div class="modal" id="modal"><div class="nm box"><button class="ib cl" id="mx" aria-label="Fermer"></button><div id="mb"></div></div></div>
<footer id="foot"></footer>

<script src="/staff.js"></script><script src="/badge3d.js"></script>
<script>
(async function(){
var esc=S.esc,db=S.db,root=document.getElementById('root'),tab='dash';
var user=await S.shell('');
var nf=function(){root.innerHTML='<section class="nm card nf" style="max-width:640px;margin:30px auto"><b>404</b><h2 style="font-size:26px;margin:10px 0 8px">Page introuvable</h2><p class="mut">Cette page n\'existe pas ou a été déplacée.</p><p style="margin-top:22px"><a class="btn pri" href="/">Retour à l\'accueil</a></p></section>'};
if(!user||!S.admin){nf();return}

var D={pos:[],cats:[],profs:[],inv:[],regs:[],regsErr:''};
async function load(){var q=await Promise.all([db.from('staff_positions').select('*').order('sort').order('title'),db.from('staff_categories').select('*').order('sort').order('name'),db.from('staff_profiles').select('*').order('created_at',{ascending:false}),db.from('staff_invites').select('*').order('created_at',{ascending:false}),db.rpc('staff_admin_registrations')]);
 q.slice(0,4).forEach(function(r){if(r.error)S.toast(r.error.message,1)});D.regs=q[4].error?[]:(q[4].data||[]);D.regsErr=q[4].error?q[4].error.message:'';D.pos=q[0].data||[];D.cats=q[1].data||[];D.profs=q[2].data||[];D.inv=q[3].data||[]}
var posOf=function(id){var p=D.pos.find(function(x){return x.id===id});return p?p.title:'—'};
var catOf=function(id){var c=D.cats.find(function(x){return x.id===id});return c?c.name:'Par défaut'};
var fieldsOf=function(r){var c=D.cats.find(function(x){return x.id===r.category_id})||D.cats.find(function(x){return x.is_default});return c?c.public_fields:[]};
var ALL=S.FIELDS.map(function(f){return f[0]});
function modal(html){document.getElementById('mb').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open');document.getElementById('mb').innerHTML=''}
document.getElementById('mx').innerHTML=S.ic('x');document.getElementById('mx').onclick=closeM;
document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')closeM()};
var TABS=[['dash','grid','Tableau de bord'],['regs','plus','Inscriptions'],['profiles','users','Profils'],['invites','key','Invitations'],['cats','shield','Catégories & visibilité'],['pos','tag','Postes'],['sec','lock','Sécurité']];

function shell(inner){root.innerHTML='<div class="adm"><nav class="nm side">'+TABS.map(function(t){return'<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+S.ic(t[1])+'<span>'+t[2]+'</span>'+(t[0]==='regs'&&D.regs.length?'<b class="cnt">'+D.regs.length+'</b>':'')+'</button>'}).join('')+'</nav><section id="pane">'+inner+'</section></div>';
 root.querySelector('.side').onclick=function(e){var b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;draw()}}}
function draw(){({dash:dash,regs:regs,profiles:profiles,invites:invites,cats:cats,pos:pos,sec:security})[tab]()}

/* ---- tableau de bord ---- */
function dash(){var n=function(f){return D.profs.filter(f).length};
 shell((D.regs.length?'<section class="nm card" style="margin-bottom:18px;border-color:var(--red)"><h3>'+S.ic('plus')+D.regs.length+(D.regs.length>1?' dossiers d\'inscription en attente':' dossier d\'inscription en attente')+'</h3><button class="btn pri" data-go="regs">'+S.ic('eye')+'Examiner les dossiers</button></section>':'')+'<div class="stats"><div class="nm stat"><b>'+D.profs.length+'</b><span>Profils</span></div><div class="nm stat"><b style="color:var(--ok)">'+n(function(p){return p.status==='active'})+'</b><span>Actifs</span></div><div class="nm stat"><b>'+n(function(p){return p.status==='inactive'})+'</b><span>Inactifs</span></div><div class="nm stat"><b style="color:var(--bad)">'+n(function(p){return p.status==='suspended'||p.status==='review'})+'</b><span>Suspendus / en examen</span></div><div class="nm stat"><b style="color:#2563eb">'+D.inv.filter(function(i){return i.status==='pending'}).length+'</b><span>Invitations en attente</span></div></div>'+
 '<section class="nm card"><h3>'+S.ic('star')+'Démarrer</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn pri" data-go="invites">'+S.ic('plus')+'Créer une invitation</button><button class="btn" data-go="cats">'+S.ic('shield')+'Règles de visibilité</button><button class="btn" data-go="pos">'+S.ic('tag')+'Modifier les postes</button><button class="btn" data-go="sec">'+S.ic('lock')+'Historique de connexion</button></div></section>');
 root.querySelector('#pane').onclick=function(e){var b=e.target.closest('[data-go]');if(b){tab=b.dataset.go;draw()}}}

/* ---- profils ---- */
var pf={q:'',s:''};
function profiles(){
 shell('<div class="tools"><input id="q" placeholder="Rechercher un nom, un ID, un poste…" value="'+esc(pf.q)+'"><select id="s"><option value="">Tous les statuts</option>'+Object.keys(S.STATUS).map(function(k){return'<option value="'+k+'"'+(pf.s===k?' selected':'')+'>'+S.STATUS[k]+'</option>'}).join('')+'</select></div><div class="list" id="ls"></div>');
 function list(){var q=pf.q.toLowerCase();var rows=D.profs.filter(function(p){return(!pf.s||p.status===pf.s)&&(!q||(p.full_name+' '+p.employee_code+' '+posOf(p.position_id)+' '+catOf(p.category_id)).toLowerCase().indexOf(q)>-1)});
  document.getElementById('ls').innerHTML=rows.length?rows.map(function(p){return'<div class="nm li" data-id="'+p.user_id+'"><div class="av">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':esc((p.full_name||'?')[0]))+'</div><div class="info"><b>'+esc(p.full_name)+'</b>'+S.verifiedBadge(p,'sm')+'<span class="small mut">'+esc(posOf(p.position_id))+' · '+esc(catOf(p.category_id))+' · '+esc(p.employee_code)+'</span><br><span class="small mut">Actif depuis '+esc(S.date(p.activated_at))+(p.status_reason?' · '+esc(p.status_reason):'')+'</span></div><span class="pill '+p.status+'">'+S.STATUS[p.status]+'</span><div class="act"><button class="btn sm" data-a="view">'+S.ic('eye')+'Voir</button><button class="btn sm" data-a="edit">'+S.ic('edit')+'Modifier</button><select class="sm" data-a="st" style="width:auto;padding:9px 12px"><option value="">Statut…</option>'+Object.keys(S.STATUS).filter(function(k){return k!==p.status}).map(function(k){return'<option value="'+k+'">'+({active:'Activer',inactive:'Désactiver',suspended:'Suspendre',review:'Mettre en examen'})[k]+'</option>'}).join('')+'</select><button class="btn sm" data-a="vf">'+S.ic('shield')+(p.verified?'Retirer le badge':'Vérifier')+'</button><button class="btn sm" data-a="pw">'+S.ic('key')+'Mot de passe</button><button class="btn sm" data-a="link" aria-label="Copier le lien">'+S.ic('link')+'</button><button class="btn sm dng" data-a="del" aria-label="Supprimer">'+S.ic('trash')+'</button></div></div>'}).join(''):'<div class="empty">Aucun profil'+(D.profs.length?' ne correspond.':' pour l\'instant. Créez une invitation pour commencer.')+'</div>'}
 list();
 document.getElementById('q').oninput=function(e){pf.q=e.target.value;list()};document.getElementById('s').onchange=function(e){pf.s=e.target.value;list()};
 var host=document.getElementById('ls');
 host.onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;var id=b.closest('.li').dataset.id,p=D.profs.find(function(x){return x.user_id===id});
  if(b.dataset.a==='link')return S.copy(S.pubUrl(S.idOf(p)),'Lien du profil copié');
  if(b.dataset.a==='vf'){var nv=!p.verified;return db.from('staff_profiles').update({verified:nv,verified_at:nv?new Date().toISOString():null}).eq('user_id',id).then(function(r){if(r.error)return S.toast(r.error.message,1);S.toast(p.full_name+(nv?' : profil vérifié':' : vérification retirée'));refresh()})}
  if(b.dataset.a==='pw')return pwP(p);
  if(b.dataset.a==='view')return viewP(p,'public');
  if(b.dataset.a==='edit')return editP(p);
  if(b.dataset.a==='del'){if(!confirm('Supprimer définitivement le profil de '+p.full_name+' ? (Son compte de connexion reste, mais le profil et son ID disparaissent.)'))return;db.from('staff_profiles').delete().eq('user_id',id).then(function(r){if(r.error)return S.toast(r.error.message,1);S.toast('Profil supprimé');refresh()})}};
 host.onchange=async function(e){var s=e.target;if(s.dataset.a!=='st'||!s.value)return;var id=s.closest('.li').dataset.id,p=D.profs.find(function(x){return x.user_id===id}),reason=null;
  if(s.value==='suspended'||s.value==='review'){reason=prompt('Motif (visible par l\'administration uniquement) :','');if(reason===null){s.value='';return}}
  var r=await db.from('staff_profiles').update({status:s.value,status_reason:reason||null}).eq('user_id',id);if(r.error)return S.toast(r.error.message,1);S.toast(p.full_name+' : '+S.STATUS[s.value]);refresh()}}
/* ---- réinitialisation du mot de passe d'un employé ---- */
function genPw(){var L='ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz',N='23456789',o,b=new Uint8Array(10);
 do{crypto.getRandomValues(b);o='';for(var i=0;i<10;i++){var s=(i===3||i===7)?N:L+N;o+=s[b[i]%s.length]}}while(!/[A-Za-z]/.test(o)||!/\d/.test(o));return o}
function pwP(p){
 if(S.user&&p.user_id===S.user.id)return S.toast('Pour votre propre compte, utilisez l\'onglet Sécurité de « Mon espace ».',1);
 modal('<h3 style="margin:0 46px 6px 0">'+S.ic('key')+' Réinitialiser le mot de passe</h3><p class="small mut" style="margin-bottom:16px"><b>'+esc(p.full_name)+'</b> · ID de connexion <b>'+esc(p.employee_code)+'</b></p><div class="msg" id="pwm" style="display:none" role="alert"></div><div id="pwb"><form id="pwf" novalidate><div class="field"><label for="npw">Nouveau mot de passe temporaire</label><div style="display:flex;gap:8px"><input id="npw" type="text" value="'+genPw()+'" minlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.06em" required><button type="button" class="btn sm" id="npg">Générer</button></div><span class="small mut">8 caractères minimum, avec une lettre et un chiffre. Vous pouvez aussi en écrire un vous-même.</span></div><div class="msg" style="margin-bottom:16px">L\'employé sera <b>déconnecté de tous ses appareils</b> et devra <b>choisir son propre mot de passe</b> dès sa prochaine connexion.</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="pwgo">'+S.ic('check')+'Réinitialiser</button><button type="button" class="btn" id="pwno">Annuler</button></div></form></div>');
 var $=function(i){return document.getElementById(i)},show=function(t){var m=$('pwm');m.style.display=t?'block':'none';m.textContent=t||''};
 $('npg').onclick=function(){$('npw').value=genPw()};$('pwno').onclick=closeM;
 $('pwf').onsubmit=async function(e){e.preventDefault();show('');var pw=$('npw').value;
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){show('Mot de passe trop faible : 8 caractères minimum, avec au moins une lettre et un chiffre.');return}
  $('pwgo').disabled=true;
  var r=await db.rpc('staff_admin_set_password',{p_user:p.user_id,p_password:pw});
  if(r.error){$('pwgo').disabled=false;show(/staff_admin_set_password/.test(r.error.message)&&/function|schema cache/i.test(r.error.message)?'La fonction n\'est pas installée : exécutez staff-v4.sql.txt dans Supabase > SQL Editor.':r.error.message);return}
  var url=location.origin+'/connexion',msg='Bonjour '+(p.full_name||'').split(' ')[0]+',\nvotre accès WYK STAFF a été réinitialisé.\n\nID : '+p.employee_code+'\nMot de passe temporaire : '+pw+'\nConnexion : '+url+'\n\nVous devrez choisir un nouveau mot de passe dès votre première connexion.';
  $('pwb').innerHTML='<div class="msg ok" style="margin-bottom:14px">Mot de passe réinitialisé. Transmettez-le à l\'employé par un canal privé : il ne sera plus affiché ensuite.</div><div class="nm-in" style="padding:16px;margin-bottom:14px"><div class="small mut">ID de connexion</div><b style="font-size:18px;letter-spacing:.04em">'+esc(p.employee_code)+'</b><div class="small mut" style="margin-top:10px">Mot de passe temporaire</div><b id="pwv" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;word-break:break-all">'+esc(pw)+'</b></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="pwc1">'+S.ic('link')+'Copier le mot de passe</button><button class="btn" id="pwc2">Copier le message complet</button><button class="btn" id="pwc3">Fermer</button></div>';
  $('pwc1').onclick=function(){S.copy(pw,'Mot de passe copié')};$('pwc2').onclick=function(){S.copy(msg,'Message copié')};$('pwc3').onclick=closeM;
  refresh()}}
var hasOpen=function(){return D.pos.length?('open_for_signup' in D.pos[0]):true};
function posDesc(id){var p=D.pos.find(function(x){return x.id===id});return p?p.description:''}
function posIco(id){var p=D.pos.find(function(x){return x.id===id});return p?p.icon:''}
function viewP(p,mode){var F=mode==='full'?ALL:fieldsOf(p),code=S.idOf(p);
 modal('<div style="display:flex;gap:10px;margin:0 46px 18px 0;flex-wrap:wrap"><button class="btn sm'+(mode==='public'?' pri':'')+'" id="v1">Vue publique</button><button class="btn sm'+(mode==='full'?' pri':'')+'" id="v2">Vue complète (admin)</button><button class="btn sm'+(mode==='badge'?' pri':'')+'" id="v3">'+S.ic('badge')+'Badge</button></div><div id="vp"></div>');
 var el=document.getElementById('vp'),v=S.view(p,posOf(p.position_id),mode==='badge'?fieldsOf(p):F,posDesc(p.position_id),posIco(p.position_id));
 if(mode==='badge'){el.innerHTML='<div class="bdg-host">'+S.badgeCard(v,{code:code})+'</div><p class="bdg-note">Badge tel que le public le voit (règles de la catégorie). Lien : '+esc(S.badgeUrl(code))+'</p>';S.bindBadge(el,{code:code,name:p.full_name});if(S.badge3D)S.badge3D(el,v,{code:code})}
 else{el.innerHTML=S.renderProfile(v,{code:code,noActs:true});S.bindProfile(el,code,p.full_name)}
 document.getElementById('v1').onclick=function(){viewP(p,'public')};document.getElementById('v2').onclick=function(){viewP(p,'full')};document.getElementById('v3').onclick=function(){viewP(p,'badge')}}
function editP(p){modal('<h3 style="margin:0 46px 16px 0">Modifier — '+esc(p.full_name)+'</h3><div id="ed"></div>');
 S.editor(document.getElementById('ed'),p,{admin:true,positions:D.pos,categories:D.cats,fields:fieldsOf(p),onSaved:function(){closeM();refresh()}})}
async function refresh(){await load();draw()}

/* ---- invitations ---- */
function genCode(){var a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',b=new Uint8Array(6);crypto.getRandomValues(b);return'WYK-'+[].map.call(b,function(x){return a[x%a.length]}).join('')}
function invites(){
 shell('<section class="nm card" style="margin-bottom:22px"><h3>'+S.ic('plus')+'Nouvelle invitation</h3><form id="nf"><div class="row"><div class="field"><label>Code</label><div style="display:flex;gap:8px"><input id="ic" value="'+genCode()+'" style="text-transform:uppercase;font-weight:600;letter-spacing:.06em" required><button type="button" class="btn sm" id="ig">Générer</button></div></div><div class="field"><label>Poste</label><select id="ip" required><option value="">— Choisir —</option>'+D.pos.map(function(p){return'<option value="'+p.id+'">'+esc(p.title)+'</option>'}).join('')+'</select></div><div class="field"><label>Catégorie</label><select id="icat"><option value="">Par défaut</option>'+D.cats.filter(function(c){return!c.is_default}).map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Expire le (facultatif)</label><input type="date" id="ix"></div></div><div class="field"><label>Note interne (facultatif)</label><input id="in" placeholder="Pour qui est ce code ?"></div><button class="btn pri">'+S.ic('check')+'Créer l\'invitation</button></form></section><div class="list" id="il"></div>');
 document.getElementById('ig').onclick=function(){document.getElementById('ic').value=genCode()};
 document.getElementById('nf').onsubmit=async function(e){e.preventDefault();var x=document.getElementById('ix').value;
  var r=await db.from('staff_invites').insert({code:document.getElementById('ic').value.trim().toUpperCase(),position_id:document.getElementById('ip').value||null,category_id:document.getElementById('icat').value||null,note:document.getElementById('in').value||null,expires_at:x?new Date(x+'T23:59:59').toISOString():null,created_by:S.user.id});
  if(r.error)return S.toast(/duplicate/.test(r.error.message)?'Ce code existe déjà.':r.error.message,1);S.toast('Invitation créée');refresh()};
 var link=function(c){return location.origin+'/activer?code='+encodeURIComponent(c)};
 document.getElementById('il').innerHTML=D.inv.length?D.inv.map(function(i){return'<div class="nm li" data-id="'+i.id+'"><div class="info"><b style="letter-spacing:.06em">'+esc(i.code)+'</b><span class="small mut">'+esc(posOf(i.position_id))+' · '+esc(catOf(i.category_id))+(i.note?' · '+esc(i.note):'')+'</span><br><span class="small mut">Créée le '+esc(S.date(i.created_at,'full'))+(i.expires_at?' · expire le '+esc(S.date(i.expires_at,'full')):'')+'</span></div><span class="pill '+i.status+'">'+({pending:'En attente',used:'Utilisé',revoked:'Annulé'})[i.status]+'</span><div class="act">'+(i.status==='pending'?'<button class="btn sm" data-a="lk">'+S.ic('link')+'Copier le lien</button><button class="btn sm" data-a="cd">Copier le code</button><button class="btn sm dng" data-a="rv">Annuler</button>':'')+'<button class="btn sm dng" data-a="dl" aria-label="Supprimer">'+S.ic('trash')+'</button></div></div>'}).join(''):'<div class="empty">Aucune invitation.</div>';
 document.getElementById('il').onclick=async function(e){var b=e.target.closest('button[data-a]');if(!b)return;var id=b.closest('.li').dataset.id,i=D.inv.find(function(x){return x.id===id});
  if(b.dataset.a==='lk')return S.copy(link(i.code),'Lien d\'invitation copié');if(b.dataset.a==='cd')return S.copy(i.code,'Code copié');
  var r=b.dataset.a==='rv'?await db.from('staff_invites').update({status:'revoked'}).eq('id',id):(confirm('Supprimer cette invitation ?')?await db.from('staff_invites').delete().eq('id',id):null);
  if(r){if(r.error)return S.toast(r.error.message,1);refresh()}}}

/* ---- catégories & visibilité ---- */
var selCat=null;
function cats(){if(!D.cats.find(function(c){return c.id===selCat}))selCat=(D.cats[0]||{}).id;var c=D.cats.find(function(x){return x.id===selCat});
 shell('<div class="grid2" style="grid-template-columns:260px 1fr;align-items:start"><section class="nm card"><h3>'+S.ic('tag')+'Catégories</h3><div class="list" id="cl">'+D.cats.map(function(x){return'<button class="nm-s li" data-c="'+x.id+'" style="'+(x.id===selCat?'box-shadow:var(--in);color:var(--red)':'')+';justify-content:space-between;text-align:left"><span><b style="font-size:15px">'+esc(x.name)+'</b></span><span class="small mut">'+D.profs.filter(function(p){return x.is_default?!p.category_id:p.category_id===x.id}).length+'</span></button>'}).join('')+'</div><button class="btn sm" id="nc" style="margin-top:14px">'+S.ic('plus')+'Nouvelle catégorie</button></section>'+
 '<section class="nm card" id="ce"></section></div>');
 var ce=document.getElementById('ce');
 if(c)ce.innerHTML='<h3>'+S.ic('eye')+'Visible publiquement — '+esc(c.name)+'</h3><p class="small mut" style="margin-bottom:14px">'+(c.is_default?'Cette catégorie s\'applique aux profils sans catégorie.':'Cochez ce que le public peut voir pour les profils de cette catégorie.')+' Le nom, le poste et le statut sont toujours visibles. « Âge » et « Date de naissance exacte » sont indépendants : vous pouvez montrer l\'âge seul.</p><div class="fgrid">'+S.FIELDS.map(function(f){return'<label class="fchk"><input type="checkbox" value="'+f[0]+'"'+(c.public_fields.indexOf(f[0])>-1?' checked':'')+'>'+f[1]+'</label>'}).join('')+'</div>'+(c.is_default?'':'<div class="field" style="margin-top:18px"><label>Nom de la catégorie</label><input id="cn" value="'+esc(c.name)+'"></div>')+'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn pri" id="cs">'+S.ic('check')+'Enregistrer</button><button class="btn" id="ca">Appliquer à toutes les catégories</button>'+(c.is_default?'':'<button class="btn dng" id="cd">'+S.ic('trash')+'Supprimer</button>')+'</div>';
 var sel=function(){return[].map.call(ce.querySelectorAll('input[type=checkbox]:checked'),function(i){return i.value})};
 document.getElementById('cl').onclick=function(e){var b=e.target.closest('[data-c]');if(b){selCat=b.dataset.c;cats()}};
 document.getElementById('nc').onclick=async function(){var n=prompt('Nom de la nouvelle catégorie (ex : Livraison)');if(!n)return;var d=D.cats.find(function(x){return x.is_default});var r=await db.from('staff_categories').insert({name:n.trim(),public_fields:d?d.public_fields:[],sort:D.cats.length}).select().single();if(r.error)return S.toast(r.error.message,1);selCat=r.data.id;refresh()};
 if(!c)return;
 document.getElementById('cs').onclick=async function(){var u={public_fields:sel()},n=document.getElementById('cn');if(n){if(!n.value.trim())return S.toast('Nom requis',1);u.name=n.value.trim()}var r=await db.from('staff_categories').update(u).eq('id',c.id);if(r.error)return S.toast(r.error.message,1);S.toast('Règles enregistrées');refresh()};
 document.getElementById('ca').onclick=async function(){if(!confirm('Copier ces règles sur toutes les catégories ?'))return;var r=await db.from('staff_categories').update({public_fields:sel()}).neq('id','00000000-0000-0000-0000-000000000000');if(r.error)return S.toast(r.error.message,1);S.toast('Règles appliquées partout');refresh()};
 var cd=document.getElementById('cd');if(cd)cd.onclick=async function(){if(!confirm('Supprimer « '+c.name+' » ? Ses profils passeront en catégorie par défaut.'))return;var r=await db.from('staff_categories').delete().eq('id',c.id);if(r.error)return S.toast(r.error.message,1);selCat=null;refresh()}}


/* ---- outils : navigateur, dates, détails d'appareil ---- */
var ua=function(u){u=String(u||'');var b=/Edg\//.test(u)?'Edge':/OPR\/|Opera/.test(u)?'Opera':/SamsungBrowser/.test(u)?'Samsung Internet':/Firefox\//.test(u)?'Firefox':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':'Navigateur';var o=/Android/.test(u)?'Android':/iPhone|iPad|iPod/.test(u)?'iOS':/Windows/.test(u)?'Windows':/Mac OS X|Macintosh/.test(u)?'macOS':/Linux/.test(u)?'Linux':'';return b+(o?' · '+o:'')};
var tm=function(d){return d?new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}):''};
function kv(rows){return'<div class="kv">'+rows.filter(function(r){return r[1]!=null&&r[1]!==''}).map(function(r){return'<div><small>'+esc(r[0])+'</small><span>'+esc(r[1])+'</span></div>'}).join('')+'</div>'}
function devRows(o){var i=o.info||{},c=o.client||{};return[['Adresse IP',o.ip],['Pays / ville',[i['cf-ipcountry'],i['cf-ipcity']].filter(Boolean).join(' · ')],['Navigateur',ua(i['user-agent']||c.ua)],['User-agent',i['user-agent']||c.ua],['Langue (serveur)',i['accept-language']],['X-Forwarded-For',i['x-forwarded-for']],['ID appareil',o.device_id],['Empreinte',o.fp_hash],['Fuseau horaire',c.tz],['Écran',c.screen?c.screen+(c.dpr?' @'+c.dpr+'x':''):''],['Plateforme',[c.platform,c.model,c.osv].filter(Boolean).join(' · ')],['Processeur / mémoire',(c.cores?c.cores+' cœurs':'')+(c.mem?' · '+c.mem+' Go':'')],['Tactile',c.touch!=null?c.touch+' point(s)':''],['Réseau',c.net],['Langues navigateur',c.langs],['Automatisation',c.bot?'OUI : robot probable':'']]}

/* ---- inscriptions ---- */
function regs(){
 var err=D.regsErr;
 shell(err?'<div class="msg">'+esc(/staff_admin_registrations|schema cache|does not exist|Could not find/i.test(err)?'Installez d\'abord staff-v5.sql.txt dans Supabase > SQL Editor.':err)+'</div>':(D.regs.length?'<p class="small mut" style="margin-bottom:14px">Approuver crée le profil et attribue l\'ID employé. Refuser efface le dossier : aucun ID n\'est consommé dans les deux cas tant que rien n\'est approuvé.</p><div class="list" id="rl"></div>':'<div class="empty">Aucun dossier en attente.</div>'));
 if(err||!D.regs.length)return;
 document.getElementById('rl').innerHTML=D.regs.map(function(r){var a=S.age(r.birth_date),c=r.client||{},f=[];
  if(r.same_ip>0)f.push('<span class="flag warn">IP vue sur '+r.same_ip+' autre(s) demande(s) (7 j)</span>');
  if(r.same_device>0)f.push('<span class="flag bad">Appareil déjà vu '+r.same_device+' fois</span>');
  if(r.ip_fails>=5)f.push('<span class="flag bad">'+r.ip_fails+' échecs de connexion depuis cette IP</span>');
  if(c.bot)f.push('<span class="flag bad">Robot probable</span>');
  if(!f.length)f.push('<span class="flag">Aucun signal suspect</span>');
  return'<div class="nm li" data-id="'+r.id+'"><div class="av">'+esc((r.first_name||'?')[0])+'</div><div class="info"><b>'+esc(r.first_name+' '+r.last_name)+'</b><span class="small mut">'+esc(r.ref)+(a!=null?' · '+a+' ans':'')+' · '+esc(r.phone)+(r.email?' · '+esc(r.email):'')+'</span><br><span class="small mut">'+(r.position_id?'Poste souhaité : '+esc(posOf(r.position_id))+' · ':'')+'envoyé le '+esc(tm(r.created_at))+' · IP '+esc(r.ip||'?')+' · '+esc(ua((r.info||{})['user-agent']||c.ua))+'</span><div class="flags">'+f.join('')+'</div></div><div class="act"><button class="btn sm" data-a="det">'+S.ic('eye')+'Détails</button><button class="btn sm pri" data-a="ap">'+S.ic('check')+'Approuver</button><button class="btn sm dng" data-a="rj">'+S.ic('x')+'Refuser</button></div></div>'}).join('');
 document.getElementById('rl').onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;var r=D.regs.find(function(x){return x.id===b.closest('.li').dataset.id});if(!r)return;
  if(b.dataset.a==='det')return modal('<h3 style="margin:0 46px 8px 0">'+esc(r.first_name+' '+r.last_name)+'</h3><p class="small mut">Dossier '+esc(r.ref)+'</p>'+kv([['Date de naissance',S.date(r.birth_date,'full')],['Téléphone',r.phone],['Email',r.email],['Envoyé le',tm(r.created_at)]].concat(devRows(r))));
  if(b.dataset.a==='ap')return approveM(r);
  var reason=prompt('Motif du refus (visible par le candidat, facultatif) :','');if(reason===null)return;
  if(!confirm('Refuser et effacer le dossier de '+r.first_name+' '+r.last_name+' ?'))return;
  db.rpc('staff_admin_reject_registration',{p_id:r.id,p_reason:reason||null}).then(function(x){if(x.error)return S.toast(x.error.message,1);S.toast('Dossier refusé et effacé');refresh()})}}
function approveM(r){
 modal('<h3 style="margin:0 46px 6px 0">'+S.ic('check')+' Approuver le dossier</h3><p class="small mut" style="margin-bottom:16px"><b>'+esc(r.first_name+' '+r.last_name)+'</b> · '+esc(r.ref)+'</p><div class="msg" id="am" style="display:none" role="alert"></div><div id="ab"><div class="field"><label for="ap">Poste</label><select id="ap"><option value="">— Choisir —</option>'+D.pos.map(function(p){return'<option value="'+p.id+'"'+(p.id===r.position_id?' selected':'')+'>'+esc(p.title)+'</option>'}).join('')+'</select></div><div class="field"><label for="ac">Catégorie</label><select id="ac"><option value="">Par défaut</option>'+D.cats.filter(function(c){return!c.is_default}).map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="msg ok">L\'ID employé (ex. WYK-XXX-004) est attribué <b>maintenant</b>, puis le dossier est effacé. Le candidat pourra ensuite compléter son profil.</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="ago">'+S.ic('check')+'Approuver</button><button class="btn" id="ano">Annuler</button></div></div>');
 var $=function(i){return document.getElementById(i)};$('ano').onclick=closeM;
 $('ago').onclick=async function(){var pos=$('ap').value;if(!pos){$('am').style.display='block';$('am').textContent='Choisissez un poste.';return}
  $('ago').disabled=true;var x=await db.rpc('staff_admin_approve_registration',{p_id:r.id,p_position:pos,p_category:$('ac').value||null});
  if(x.error){$('ago').disabled=false;$('am').style.display='block';$('am').textContent=x.error.message;return}
  var code=x.data.employee_code,msg='Bonjour '+r.first_name+',\nvotre dossier WYK STAFF a été approuvé.\n\nVotre ID employé : '+code+'\nConnexion : '+location.origin+'/connexion (ID + le mot de passe choisi à l\'inscription)\n\nVous pouvez maintenant compléter votre profil : photo, parcours, compétences.';
  $('am').style.display='none';$('ab').innerHTML='<div class="msg ok">Dossier approuvé et effacé.</div><div class="nm-in" style="padding:16px;margin-bottom:14px"><div class="small mut">ID employé attribué</div><b style="font-size:22px;letter-spacing:.05em">'+esc(code)+'</b></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="c1">'+S.ic('link')+'Copier le message</button><button class="btn" id="c2">Fermer</button></div>';
  $('c1').onclick=function(){S.copy(msg,'Message copié')};$('c2').onclick=closeM;refresh()}}

/* ---- sécurité : historique de connexion ---- */
var sc={view:'login',outcome:'',q:'',limit:100,rows:[],sum:null};
var OUT={success:['Réussie','success'],fail:['Échec','fail'],pending:['Échec','fail'],blocked:['Bloquée','blocked'],cleared:['Débloquée','cleared'],submitted:['Envoyé','submitted'],approved:['Approuvé','approved'],rejected:['Refusé','rejected']};
var outOf=function(r){if(r.outcome==='pending'&&Date.now()-new Date(r.created_at)<120000)return['En cours','pending'];return OUT[r.outcome]||[r.outcome,'']};
var KIND={ip:'Adresse IP',device:'Appareil',fp:'Empreinte',id:'Compte'};
var wait=function(sec){return S.fmtWait(sec)};
function security(){shell('<div id="sx"><div class="empty">Chargement…</div></div>');secLoad()}
async function secLoad(){
 var q=await Promise.all([db.rpc('staff_admin_security_summary'),sc.view==='login'?db.rpc('staff_admin_login_log',{p_limit:sc.limit,p_offset:0,p_outcome:sc.outcome||null,p_q:sc.q||null}):db.rpc('staff_admin_reg_log',{p_limit:sc.limit})]);
 var host=document.getElementById('sx');if(!host)return;
 if(q[0].error||q[1].error){var m=(q[0].error||q[1].error).message;host.innerHTML='<div class="msg">'+esc(/staff_admin|schema cache|does not exist|Could not find/i.test(m)?'Installez d\'abord staff-v5.sql.txt dans Supabase > SQL Editor.':m)+'</div>';return}
 sc.sum=q[0].data||{};sc.rows=q[1].data||[];var u=sc.sum,lk=u.locked||[];
 host.innerHTML='<div class="stats"><div class="nm stat"><b style="color:var(--ok)">'+(u.success_24h||0)+'</b><span>Connexions réussies (24 h)</span></div><div class="nm stat"><b style="color:var(--bad)">'+(u.fail_24h||0)+'</b><span>Échecs (24 h)</span></div><div class="nm stat"><b style="color:var(--warn)">'+(u.blocked_24h||0)+'</b><span>Tentatives bloquées (24 h)</span></div><div class="nm stat"><b>'+(u.ips_24h||0)+'</b><span>Adresses IP (24 h)</span></div></div>'+
 (lk.length?'<section class="nm card" style="margin-bottom:18px"><h3>'+S.ic('lock')+'Blocages en cours</h3><div class="list">'+lk.map(function(x,i){return'<div class="nm-s li"><div class="info"><b style="font-size:15px">'+esc(KIND[x.kind]||x.kind)+'</b> <span style="font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all">'+esc(x.value)+'</span><br><span class="small mut">'+x.fails+' échecs · encore '+esc(wait(x.secs))+'</span></div><div class="act"><button class="btn sm" data-ub="'+i+'">Débloquer</button></div></div>'}).join('')+'</div></section>':'')+
 '<div class="seg"><button class="tab'+(sc.view==='login'?' on':'')+'" data-v="login">'+S.ic('lock')+'Connexions</button><button class="tab'+(sc.view==='reg'?' on':'')+'" data-v="reg">'+S.ic('plus')+'Inscriptions</button></div>'+
 (sc.view==='login'?'<div class="tools"><select id="so"><option value="">Tous les résultats</option><option value="success"'+(sc.outcome==='success'?' selected':'')+'>Réussies</option><option value="fail"'+(sc.outcome==='fail'?' selected':'')+'>Échecs</option><option value="blocked"'+(sc.outcome==='blocked'?' selected':'')+'>Bloquées</option></select><input id="sq" placeholder="Rechercher un ID, une IP, un appareil…" value="'+esc(sc.q)+'"></div>':'')+
 '<div class="list" id="sl">'+(sc.rows.length?sc.rows.map(function(r,i){var o=outOf(r),inf=r.info||{},cl=r.client||{},nm=sc.view==='login'?(r.ident||'—'):(r.ref||'Tentative bloquée');
  return'<div class="nm li lg" data-i="'+i+'"><span class="pill '+o[1]+'">'+o[0]+'</span><div class="info"><b>'+esc(nm)+'</b>'+(r.name?' <span class="small mut">'+esc(r.name)+'</span>':'')+(r.employee_code?' <span class="small mut">→ '+esc(r.employee_code)+'</span>':'')+'<br><span class="small mut">IP '+esc(r.ip||'?')+(inf['cf-ipcountry']?' ('+esc(inf['cf-ipcountry'])+')':'')+' · '+esc(ua(inf['user-agent']||cl.ua))+(r.reason?' · '+esc(r.reason):'')+'</span></div><span class="small mut">'+esc(tm(r.created_at))+'</span></div>'}).join(''):'<div class="empty">Aucune entrée.</div>')+'</div>'+
 (sc.rows.length>=sc.limit?'<p style="text-align:center;margin-top:14px"><button class="btn" id="sm">Afficher plus</button></p>':'')+
 '<p style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" id="sr">'+S.ic('clock')+'Actualiser</button><button class="btn sm dng" id="sp">'+S.ic('trash')+'Effacer l\'historique de plus de 90 jours</button></p>'+
 '<p class="small mut" style="margin-top:10px;line-height:1.5">Verrouillage automatique par paliers : 5 échecs depuis un appareil (5 min), puis 30 min, 6 h, 24 h ; mêmes règles par adresse IP (seuils plus larges) et par compte ciblé. Un blocage s\'applique avant même la saisie du mot de passe.</p>';
 var $=function(i){return host.querySelector('#'+i)};
 host.onclick=async function(e){
  var v=e.target.closest('[data-v]');if(v){sc.view=v.dataset.v;sc.limit=100;return secLoad()}
  var ub=e.target.closest('[data-ub]');if(ub){var x=lk[+ub.dataset.ub];return unblock(x.kind,x.value)}
  if(e.target.closest('#sm')){sc.limit+=100;return secLoad()}if(e.target.closest('#sr'))return secLoad();
  if(e.target.closest('#sp')){if(!confirm('Effacer les entrées de plus de 90 jours ?'))return;var r=await db.rpc('staff_admin_purge_logs',{p_days:90});if(r.error)return S.toast(r.error.message,1);S.toast(r.data+' entrée(s) effacée(s)');return secLoad()}
  var li=e.target.closest('.li.lg');if(li)detail(sc.rows[+li.dataset.i])};
 if($('so'))$('so').onchange=function(){sc.outcome=$('so').value;secLoad()};
 if($('sq'))$('sq').onchange=function(){sc.q=$('sq').value.trim();secLoad()};
}
async function unblock(kind,value){var r=await db.rpc('staff_admin_unblock',{p_kind:kind,p_value:value});if(r.error)return S.toast(r.error.message,1);S.toast('Débloqué');closeM();secLoad()}
function detail(r){var o=outOf(r),base=sc.view==='login'?[['Date',tm(r.created_at)],['Résultat',o[0]],['Motif',r.reason],['Identifiant saisi',r.ident],['Compte',r.name]]:[['Date',tm(r.created_at)],['Résultat',o[0]],['N° de dossier',r.ref],['ID employé',r.employee_code],['Motif',r.reason]];
 var can=r.outcome==='fail'||r.outcome==='pending'||r.outcome==='blocked';
 modal('<h3 style="margin:0 46px 6px 0">'+S.ic('lock')+' Détail</h3><span class="pill '+o[1]+'">'+o[0]+'</span>'+kv(base.concat(devRows(r)))+(can&&sc.view==='login'?'<div style="display:flex;gap:8px;flex-wrap:wrap">'+(r.ip?'<button class="btn sm" data-u="ip">Débloquer cette IP</button>':'')+(r.device_id?'<button class="btn sm" data-u="device">Débloquer cet appareil</button>':'')+(r.ident?'<button class="btn sm" data-u="id">Débloquer ce compte</button>':'')+'</div>':''));
 document.getElementById('mb').onclick=function(e){var b=e.target.closest('[data-u]');if(!b)return;unblock(b.dataset.u,b.dataset.u==='ip'?r.ip:b.dataset.u==='device'?r.device_id:r.ident)}}

/* ---- postes ---- */
function pos(){
 shell('<section class="nm card" style="margin-bottom:22px"><h3>'+S.ic('plus')+'Nouveau poste</h3><form id="pn"><div class="row"><div class="field"><label>Intitulé</label><input id="pt" placeholder="Livreur" required></div><div class="field"><label>Code (3 lettres, pour l\'ID)</label><input id="pc" maxlength="4" placeholder="LIV" style="text-transform:uppercase" required></div></div><div class="field"><label>Description du poste (affichée sur le badge)</label><textarea id="pd" style="min-height:70px" maxlength="220" placeholder="Ex : Livraison des commandes WYK, rapidité et service irréprochable."></textarea></div><div class="field"><label>Icône du badge</label>'+S.iconPicker('','np')+'</div><label class="chk" style="margin:0 0 16px"><input type="checkbox" id="po-open"><span><b>Ouvert aux inscriptions</b> : proposé aux candidats dans le formulaire d\'inscription.</span></label><button class="btn pri">'+S.ic('plus')+'Ajouter</button></form></section><div class="list" id="pl"></div>');
 document.getElementById('pl').innerHTML=D.pos.length?D.pos.map(function(p){return'<div class="nm li" data-id="'+p.id+'"><div class="field" style="margin:0;flex:2;min-width:180px"><input data-f="title" value="'+esc(p.title)+'"></div><div class="field" style="margin:0;width:110px"><input data-f="code" value="'+esc(p.code)+'" maxlength="4" style="text-transform:uppercase"></div><div class="field" style="margin:0;flex:1 1 100%"><textarea data-f="description" maxlength="220" style="min-height:62px" placeholder="Description du poste (badge)">'+esc(p.description||'')+'</textarea></div><div class="field" style="margin:0;flex:1 1 100%"><label>Icône du badge</label>'+S.iconPicker(p.icon||'')+'</div><div class="field" style="margin:0;flex:1 1 100%"><label class="chk" style="margin:0"><input type="checkbox" data-f="open"'+(p.open_for_signup?' checked':'')+'><span>Ouvert aux inscriptions</span></label></div><span class="small mut">'+D.profs.filter(function(x){return x.position_id===p.id}).length+' profil(s)</span><div class="act"><button class="btn sm" data-a="sv">'+S.ic('check')+'Enregistrer</button><button class="btn sm dng" data-a="dl" aria-label="Supprimer">'+S.ic('trash')+'</button></div></div>'}).join(''):'<div class="empty">Aucun poste.</div>';
 document.getElementById('pn').onsubmit=async function(e){e.preventDefault();var r=await db.from('staff_positions').insert(Object.assign({title:document.getElementById('pt').value.trim(),code:document.getElementById('pc').value.trim().toUpperCase(),description:document.getElementById('pd').value.trim()||null,icon:document.getElementById('pn').querySelector('[data-f=icon]').value||null,sort:D.pos.length+1},hasOpen()?{open_for_signup:document.getElementById('po-open').checked}:{}));if(r.error)return S.toast(r.error.message,1);S.toast('Poste ajouté');refresh()};
 S.bindIconPickers(document.getElementById('pn'));S.bindIconPickers(document.getElementById('pl'));
 document.getElementById('pl').onclick=async function(e){var b=e.target.closest('button[data-a]');if(!b)return;var li=b.closest('.li'),id=li.dataset.id,r;
  if(b.dataset.a==='sv')r=await db.from('staff_positions').update(Object.assign({title:li.querySelector('[data-f=title]').value.trim(),code:li.querySelector('[data-f=code]').value.trim().toUpperCase(),description:li.querySelector('[data-f=description]').value.trim()||null,icon:li.querySelector('[data-f=icon]').value||null},hasOpen()?{open_for_signup:li.querySelector('[data-f=open]').checked}:{})).eq('id',id);
  else{if(!confirm('Supprimer ce poste ? Les profils concernés n\'auront plus de poste affiché.'))return;r=await db.from('staff_positions').delete().eq('id',id)}
  if(r.error)return S.toast(r.error.message,1);S.toast('Fait');refresh()}}

await load();draw();
})();
</script>

<!doctype html>
<html lang="fr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://byrklytqoucdskzvcoau.supabase.co wss://byrklytqoucdskzvcoau.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f3f4f7" id="wykThemeColor"><script>!function(){try{var t=localStorage.getItem('wyk-staff-theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.style.colorScheme='light'}}();</script>
<title>Mon profil — WYK STAFF</title><meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="/staff.css"><link rel="stylesheet" href="/badge3d.css">
</head><body>
<header id="top"></header>
<main><div class="wrap" id="root"><div class="nm card empty">Chargement…</div></div></main>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/staff.js"></script><script src="/badge3d.js"></script>
<script>
(async function(){
  var root=document.getElementById('root'),esc=S.esc;
  var user=await S.shell('');
  if(!user){location.href='/';return}
  await S.tryPending();
  var row=await S.myProfile();
  if(!row){root.innerHTML='<div class="nm card unavail" style="max-width:520px;margin:auto"><h2>Pas encore de profil</h2><p class="mut">Ce compte n\'est lié à aucun profil WYK. Entrez le code d\'invitation reçu de WYK pour créer le vôtre.</p><p style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn pri" href="/activer">'+S.ic('key')+'Entrer mon code</a>'+(S.admin?'<a class="btn" href="/admin">'+S.ic('grid')+'Espace administrateur</a>':'')+'</p></div>';return}
  var q=await Promise.all([S.db.from('staff_positions').select('*'),S.db.from('staff_categories').select('*')]);
  var positions=q[0].data||[],cats=q[1].data||[];
  var posOf=function(r){return positions.find(function(x){return x.id===r.position_id})||{}};
  var fieldsOf=function(r){var c=cats.find(function(x){return x.id===r.category_id})||cats.find(function(x){return x.is_default});return c?c.public_fields:[]};
  var locked=function(r){return r.status==='suspended'||r.status==='review'};

  function paint(){
    var code=S.idOf(row),pub=S.pubUrl(code),bu=S.badgeUrl(code),F=fieldsOf(row),pos=posOf(row),age=S.age(row.birth_date),pc=S.completeness(row);
    var banner=locked(row)?'<div class="msg">Votre profil est <b>'+esc(S.STATUS[row.status].toLowerCase())+'</b> : il n\'est plus visible et ne peut pas être modifié. Contactez WYK pour plus d\'informations.</div>':(row.status==='inactive'?'<div class="msg">Votre profil est inactif : il n\'est pas visible publiquement.</div>':'');
    root.innerHTML=(S.q('bienvenue')?'<div class="msg ok">Bienvenue chez WYK ! Votre ID de connexion est <b>'+esc(row.employee_code)+'</b> : notez-le bien, il vous servira à vous connecter avec votre mot de passe. Complétez ensuite votre profil : photo, parcours, compétences.</div>':'')+banner+
    '<section class="nm card hdr-card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px"><div class="avatar">'+(row.photo_url?'<img src="'+esc(row.photo_url)+'" alt="">':S.ic('user'))+'</div><div style="flex:1;min-width:220px"><span class="pill '+row.status+'">'+esc(S.STATUS[row.status])+'</span><h2 style="font-size:clamp(24px,4vw,30px);margin:6px 0 2px">'+esc(row.full_name)+'</h2>'+S.verifiedBadge(row)+'<div class="mut">'+esc(pos.title||'')+' · '+esc(row.employee_code)+'</div><div class="small mut">Actif depuis '+esc(S.date(row.activated_at,'full'))+(age!=null?' · '+age+' ans':'')+'</div><div style="margin-top:12px;max-width:320px"><div class="small mut" style="display:flex;justify-content:space-between;margin-bottom:5px"><span>Profil complété</span><b>'+pc+'%</b></div><div class="prog"><i style="width:'+pc+'%"></i></div></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="'+esc(pub)+'" target="_blank" rel="noopener">'+S.ic('eye')+'Voir ma page</a><button class="btn" id="cp">'+S.ic('link')+'Copier le lien</button></div></section>'+
    '<div class="tabs" role="tablist"><button class="tab on" data-p="edit">'+S.ic('edit')+'Modifier</button><button class="tab" data-p="prev">'+S.ic('doc')+'Mon CV</button><button class="tab" data-p="badge">'+S.ic('badge')+'Mon badge</button><button class="tab" data-p="sec">'+S.ic('lock')+'Sécurité</button></div>'+
    '<div class="pane on" id="p-edit"></div><div class="pane" id="p-prev" style="display:none"></div><div class="pane" id="p-badge" style="display:none"></div><div class="pane" id="p-sec" style="display:none"></div>';
    document.getElementById('cp').onclick=function(){S.copy(pub,'Lien copié')};
    var ed=document.getElementById('p-edit');
    if(locked(row))ed.innerHTML='<div class="nm card empty">Modification indisponible.</div>';
    else S.editor(ed,row,{fields:F,onSaved:function(r){row=r;paint2()}});
    function paint2(){document.getElementById('p-prev').dataset.done='';document.getElementById('p-badge').dataset.done='';var on=document.querySelector('.tabs .on').dataset.p;if(on==='prev')prev();if(on==='badge')badge()}
    function prev(){var pr=document.getElementById('p-prev');pr.innerHTML='<p class="small mut no-print" style="margin-bottom:14px">Voici exactement ce que verra le public (selon les règles de votre catégorie).'+(row.status!=='active'?' <b>Votre profil n\'est pas actif : il n\'est pas encore visible.</b>':'')+'</p>'+S.renderProfile(S.view(row,pos.title||'',F,pos.description,pos.icon),{code:code});S.bindProfile(pr,code,row.full_name)}
    function badge(){var b=document.getElementById('p-badge'),v=S.view(row,pos.title||'',F,pos.description,pos.icon);
      b.innerHTML='<div class="bdg-pane"><div class="bdg-host">'+S.badgeCard(v,{code:code})+'</div>'+
      '<div class="bdg-actions no-print">'+S.badgeDlHtml()+'<button class="btn" id="bq">'+S.ic('qr')+'Afficher le QR code</button><button class="btn" id="bs">'+S.ic('share')+'Partager</button></div>'+
      '<section class="nm card no-print"><h3>'+S.ic('link')+'Lien unique de mon badge</h3><p class="small mut" style="margin-bottom:12px">Ce lien (et le QR code du badge) mène directement à votre badge public. Il est propre à vous et ne se devine pas.</p><div class="linkbox"><input id="bl" readonly value="'+esc(bu)+'" aria-label="Lien du badge"><button class="btn" id="bc">'+S.ic('link')+'Copier</button><a class="btn" href="'+esc(bu)+'" target="_blank" rel="noopener">'+S.ic('ext')+'Ouvrir</a></div></section>'+
      '<p class="bdg-note no-print">Les éléments affichés (photo, ID, QR…) dépendent des règles définies par WYK pour votre catégorie.</p></div>';
      S.bindBadge(b,{code:code,name:row.full_name});if(S.badge3D)S.badge3D(b,v,{code:code});
      S.bindBadgeDl(b,v,{code:code});document.getElementById('bc').onclick=function(){S.copy(bu,'Lien du badge copié')};
      document.getElementById('bs').onclick=function(){S.share(bu,'Badge de '+row.full_name)};
      document.getElementById('bq').onclick=function(){S.qrModal({url:bu,title:row.full_name,sub:'Scannez ce code pour ouvrir le badge en ligne.',extra:'<a class="btn sm" href="'+esc(pub)+'">'+S.ic('user')+'Voir le profil</a>'})};
      document.getElementById('bl').onclick=function(){this.select()}}
    function sec(){var s=document.getElementById('p-sec');
      s.innerHTML=(row.must_change_password?'<div class="msg" role="alert"><b>Votre mot de passe a été réinitialisé par l\'administration.</b> Choisissez maintenant un nouveau mot de passe personnel.</div>':'')+'<section class="nm card"><h3>'+S.ic('lock')+'Changer mon mot de passe</h3><div class="msg" id="sm" style="display:none" role="alert"></div><form id="sf" novalidate><div class="field" style="margin-bottom:6px"><label for="np1">Nouveau mot de passe</label><div class="pwf"><input type="password" id="np1" minlength="8" autocomplete="new-password" required><button type="button" class="eye" data-eye="np1" aria-label="Afficher le mot de passe"></button></div><div class="meter" id="smt"><i></i></div><span class="small mut">8 caractères minimum, avec une lettre et un chiffre.</span></div><div class="field"><label for="np2">Confirmer le mot de passe</label><div class="pwf"><input type="password" id="np2" autocomplete="new-password" required><button type="button" class="eye" data-eye="np2" aria-label="Afficher le mot de passe"></button></div></div><button class="btn pri" id="sb">'+S.ic('check')+'Enregistrer le mot de passe</button></form></section>';
      s.querySelectorAll('[data-eye]').forEach(function(b){b.innerHTML=S.ic('eye')});S.bindEyes(s);
      var $=function(i){return document.getElementById(i)},show=function(t,ok){var m=$('sm');m.style.display=t?'block':'none';m.className='msg'+(ok?' ok':'');m.textContent=t||''};
      var st=function(v){var n=0;if(v.length>=8)n++;if(/[a-zA-Z]/.test(v)&&/\d/.test(v))n++;if(v.length>=12)n++;if(/[^a-zA-Z0-9]/.test(v))n++;return n};
      $('np1').oninput=function(){var n=st($('np1').value),i=$('smt').firstChild;i.style.width=(n*25)+'%';i.style.background=n<2?'var(--bad)':n<3?'var(--warn)':'var(--ok)'};
      $('sf').onsubmit=async function(e){e.preventDefault();show('');var a=$('np1').value,b=$('np2').value;
        if(st(a)<2){show('Mot de passe trop faible : 8 caractères minimum, avec au moins une lettre et un chiffre.');return}
        if(a!==b){show('Les deux mots de passe ne sont pas identiques.');return}
        $('sb').disabled=true;var r=await S.db.auth.updateUser({password:a});
        if(r.error){$('sb').disabled=false;show(S.errMsg(r.error));return}
        try{await S.db.rpc('staff_clear_must_change')}catch(x){}
        row.must_change_password=false;$('sf').reset();$('sb').disabled=false;$('smt').firstChild.style.width='0';show('Mot de passe modifié.',true);S.toast('Mot de passe modifié');
        var bn=s.querySelector('.msg[role=alert]:not(#sm)');if(bn)bn.remove()}}
    document.querySelector('.tabs').onclick=function(e){var t=e.target.closest('[data-p]');if(!t)return;[].forEach.call(document.querySelectorAll('.tabs .tab'),function(x){x.classList.toggle('on',x===t)});
      ['edit','prev','badge','sec'].forEach(function(k){var el=document.getElementById('p-'+k);var on=k===t.dataset.p;el.style.display=on?'':'none';el.classList.toggle('on',on)});
      if(t.dataset.p==='prev')prev();if(t.dataset.p==='badge')badge();if(t.dataset.p==='sec')sec()};
    if(row.must_change_password){var tb=document.querySelector('.tabs [data-p=sec]');if(tb)tb.click()}
  }
  paint();
})();
</script>
</body></html>

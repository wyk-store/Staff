<!doctype html>
<html lang="fr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon profil — WYK STAFF</title><meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://i.postimg.cc/150DzRjK/Logo-wyk-avec-fond-blanc.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/staff.css">
</head><body>
<header id="top"></header>
<main><div class="wrap" id="root"><div class="nm card empty">Chargement…</div></div></main>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/staff.js"></script>
<script>
(async function(){
  var root=document.getElementById('root'),esc=S.esc;
  var user=await S.shell('');
  if(!user){location.href='/connexion';return}
  await S.tryPending();
  var row=await S.myProfile();
  if(!row){root.innerHTML='<div class="nm card unavail" style="max-width:520px;margin:auto"><h2>Pas encore de profil</h2><p class="mut">Ce compte n\'est lié à aucun profil WYK. Entrez le code d\'invitation reçu de WYK pour créer le vôtre.</p><p style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn pri" href="/activer">'+S.ic('key')+'Entrer mon code</a>'+(S.admin?'<a class="btn" href="/admin">'+S.ic('grid')+'Espace administrateur</a>':'')+'</p></div>';return}
  var q=await Promise.all([S.db.from('staff_positions').select('*'),S.db.from('staff_categories').select('*')]);
  var positions=q[0].data||[],cats=q[1].data||[];
  var posTitle=function(r){var p=positions.find(function(x){return x.id===r.position_id});return p?p.title:''};
  var fieldsOf=function(r){var c=cats.find(function(x){return x.id===r.category_id})||cats.find(function(x){return x.is_default});return c?c.public_fields:[]};
  var locked=function(r){return r.status==='suspended'||r.status==='review'};

  function paint(){
    var pub=S.pubUrl(row.employee_code),F=fieldsOf(row);
    var banner=locked(row)?'<div class="msg">Votre profil est <b>'+esc(S.STATUS[row.status].toLowerCase())+'</b> : il n\'est plus visible et ne peut pas être modifié. Contactez WYK pour plus d\'informations.</div>':(row.status==='inactive'?'<div class="msg">Votre profil est inactif : il n\'est pas visible publiquement.</div>':'');
    root.innerHTML=(S.q('bienvenue')?'<div class="msg ok">Bienvenue chez WYK ! Complétez votre profil ci-dessous : photo, parcours, compétences.</div>':'')+banner+
    '<section class="nm card hdr-card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px"><div class="avatar">'+(row.photo_url?'<img src="'+esc(row.photo_url)+'" alt="">':S.ic('user'))+'</div><div style="flex:1;min-width:200px"><span class="pill '+row.status+'">'+esc(S.STATUS[row.status])+'</span><h2 style="font-size:28px;margin:6px 0 2px">'+esc(row.full_name)+'</h2><div class="mut">'+esc(posTitle(row))+' · '+esc(row.employee_code)+'</div><div class="small mut">Actif depuis '+esc(S.date(row.activated_at,'full'))+'</div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="'+esc(pub)+'" target="_blank" rel="noopener">'+S.ic('eye')+'Voir ma page</a><button class="btn" id="cp">'+S.ic('link')+'Copier le lien</button></div></section>'+
    '<div class="tabs"><button class="tab on" data-p="edit">'+S.ic('edit')+'Modifier</button><button class="tab" data-p="prev">'+S.ic('eye')+'Aperçu public</button><button class="tab" data-p="badge">'+S.ic('badge')+'Badge &amp; QR</button></div>'+
    '<div class="pane on" id="p-edit"></div><div class="pane" id="p-prev" style="display:none"></div><div class="pane" id="p-badge" style="display:none"></div>';
    document.getElementById('cp').onclick=function(){S.copy(pub,'Lien copié')};
    var ed=document.getElementById('p-edit');
    if(locked(row))ed.innerHTML='<div class="nm card empty">Modification indisponible.</div>';
    else S.editor(ed,row,{fields:F,onSaved:function(r){row=r;var pr=document.getElementById('p-prev');pr.dataset.stale=1;badge();}});
    function prev(){var pr=document.getElementById('p-prev');pr.innerHTML='<p class="small mut" style="margin-bottom:14px">Voici exactement ce que verra le public (selon les règles de votre catégorie).'+(row.status!=='active'?' <b>Votre profil n\'est pas actif : il n\'est pas encore visible.</b>':'')+'</p>'+S.renderProfile(S.view(row,posTitle(row),F),{code:row.employee_code,noShare:false});S.bindProfile(pr,row.employee_code);pr.dataset.stale=''}
    function badge(){var b=document.getElementById('p-badge');
      b.innerHTML='<div class="badge"><div class="bh"><img class="lg" src="'+S.LOGO+'" alt="WYK"><div class="ph">'+(row.photo_url?'<img src="'+esc(row.photo_url)+'" alt="">':S.ic('user'))+'</div></div><div class="bb"><h4>'+esc(row.full_name)+'</h4><div class="r">'+esc(posTitle(row))+'</div><div data-qr="'+esc(pub)+'"></div><small>'+esc(row.employee_code)+'</small><small>Actif depuis '+esc(S.date(row.activated_at))+'</small></div></div><p style="text-align:center;margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn pri" id="pb">'+S.ic('print')+'Imprimer / enregistrer le badge</button><button class="btn" id="cp2">'+S.ic('link')+'Copier le lien</button></p>';
      S.hydrateQR(b);document.getElementById('pb').onclick=function(){document.body.classList.add('print-badge');window.print();setTimeout(function(){document.body.classList.remove('print-badge')},500)};document.getElementById('cp2').onclick=function(){S.copy(pub,'Lien copié')}}
    badge();
    document.querySelector('.tabs').onclick=function(e){var t=e.target.closest('[data-p]');if(!t)return;[].forEach.call(document.querySelectorAll('.tabs .tab'),function(x){x.classList.toggle('on',x===t)});
      ['edit','prev','badge'].forEach(function(k){var el=document.getElementById('p-'+k);var on=k===t.dataset.p;el.style.display=on?'':'none';el.classList.toggle('on',on)});
      if(t.dataset.p==='prev')prev()};
  }
  paint();
})();
</script>
</body></html>
